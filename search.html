<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search - Velora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="search">

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-compact-disc fa-spin-hover"></i>
            <h2>Velora</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li class="active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
                <li><a href="library.html"><i class="fa-solid fa-bookmark"></i> Your Library</a></li>
            </ul>
        </nav>
        
        <div class="now-playing-sidebar">
            <div id="playing-art" class="playing-art">
                <div class="art-placeholder"><i class="fa-solid fa-music"></i></div>
            </div>
            <div class="playing-info">
                <h4 id="playing-title">No Track Selected</h4>
                <p id="playing-artist">---</p>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-nav">
            <div class="user-profile">
                <a href="profile.html">
                    <img src="https://ui-avatars.com/api/?name=User&background=1DB954&color=fff" alt="User" class="avatar">
                </a>
            </div>
        </header>

        <section class="content-header">
            <input type="text" id="mainSearchInput" class="large-search" placeholder="What do you want to listen to?">
            <h1 id="search-title">Search</h1>
        </section>

        <!-- Dynamic songs container -->
        <div class="songs-grid" id="songs-container">
            <div class="empty-state">
                <i class="fa-solid fa-music"></i>
                <p>Type above to summon tracks</p>
            </div>
        </div>
    </main>
</div>

<!-- Sticky Bottom Player -->
<div class="player-bar">
    <div class="player-left">
        <div class="player-track-info">
            <div id="player-art" class="player-art"></div>
            <div class="player-track-details">
                <h4 id="player-title">Welcome to Velora</h4>
                <p id="player-artist">Ready to play</p>
            </div>
            <button id="addToLibrary" class="icon-btn tooltip" title="Add to Library">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <button id="prev" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play" class="control-btn play-btn"><i class="fa-solid fa-play"></i></button>
            <button id="next" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="progress-container">
            <span id="currentTime" class="time-text">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100" class="progress-slider">
            <span id="duration" class="time-text">0:00</span>
        </div>
    </div>
    
    <div class="player-right"></div>
</div>

<script src="script.js"></script>
</body>
</html>
